server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The sandbox is a SPA but it also ships real extra pages (launch.html for
    # the SMART launch handshake), so try the file first and fall back to the
    # app shell for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundles are large; gzip makes the first paint bearable.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
