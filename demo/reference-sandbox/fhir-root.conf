# The SMART App Launcher's provider-EHR launch auto-selects an encounter with
#   new URL("/Encounter/?_count=1&_sort:desc=date", FHIR_SERVER_R4)
# (backend/routes/auth/authorize.ts :: getFirstEncounterId).  The leading slash
# makes URL() discard any path on FHIR_SERVER_R4, so pointing the launcher
# straight at http://hapi:8080/fhir produces a request to http://hapi:8080/Encounter
# -> 404 -> "Failed to auto-select the first encounter for patient ...".
#
# This one-line reverse proxy exposes HAPI's /fhir base at the ROOT of its own
# origin, so FHIR_SERVER_R4 can be a path-less URL and the launcher's
# string-concatenation assumptions hold.
server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://hapi:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
